enabled: false
name: ad_campaign_targeting_report vs chatbi.sp_target_report
auth:
  mode: all_users
scope:
  shop_discovery: ad_auth_shops
  listing_mapping: null
tool:
  name: ad_campaign_targeting_report
  arguments:
    report_date: 2026-07-01 - 2026-07-31
    sponsored_type: sp
  dynamic_arguments:
    shop_argument: profile_ids
    shop_batch_mode: list
    source_field: profile_id
    database_source_field: sid
    batch_size: 3
    database_param: sid_values
  pagination:
    enabled: true
    page_argument: page
    page_start: 1
    page_size_argument: length
    page_size: 1000
    max_pages: 400
database:
  table: chatbi.sp_target_report
  sql: "select\n  sid,\n  :report_date as report_date,\n  sum(cost)\
    \ as cost,\n  sum(sales) as sales,\n  sum(impressions) as impressions,\n  sum(clicks)\
    \ as clicks,\n  sum(orders) as orders,\n  sum(same_orders) as same_orders,\n \
    \ sum(same_sales) as same_sales,\n  sum(units) as units,\n  sum(same_units) as\
    \ same_units\nfrom chatbi.sp_target_report\nwhere sid in :sid_values\n  and report_date\
    \ between :report_start_date and :report_end_date\n\
    group by\n  sid\n"
  params:
    report_date: 2026-07-01 - 2026-07-31
    report_start_date: "2026-07-01"
    report_end_date: "2026-07-31"
compare:
  dimensions:
    - sid
    - report_date
  metrics:
    - cost
    - sales
    - impressions
    - clicks
    - orders
    - same_orders
    - same_sales
    - units
    - same_units
  dimension_mappings:
    sid: sid
    report_date: report_date
  metric_mappings:
    spends: cost
    sales: sales
    impressions: impressions
    clicks: clicks
    orders: orders
    direct_orders: same_orders
    direct_sales: same_sales
    ad_units: units
    direct_units: same_units
  tolerance: 0.01
notes:
  raw_dimensions:
    - sid(领星中是profile_id)
    - + campaign_id
    - + ad_group_id
    - + target_id
    - + report_date
    - (+sponsored_type=sp 领星中查询时需要加上这个筛选条件）
  tool_output_fields:
    - spends
    - sales
    - impressions
    - clicks
    - orders
    - direct_orders
    - direct_sales
    - ad_units
    - direct_units
  non_numeric_fields: []
  inactive_dimensions:
    - campaign_id
    - ad_group_id
    - target_id
  source:
    Generated from data/feishu/lingxing_mcp_tools.xlsx; review SQL and field
    paths before enabling.
