  - spend
  - ad_sales_amount
  - ad_order_quantity
  - ads_sp_cost
  - shared_ads_sb_cost
  - shared_ads_sbv_cost
  - ads_sd_cost
  - ads_sp_sales
  - shared_ads_sb_sales
  - shared_ads_sbv_sales
  - ads_sd_sales
  source: 由 data/feishu/lingxing_mcp_tools.xlsx 的可用tool表生成，启用前请检查 SQL 和字段口径。
