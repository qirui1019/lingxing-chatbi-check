enabled: false
name: get_fba_stock_list vs chatbi.fba_list
auth:
  mode: all_users
scope:
  shop_discovery: get_my_sids
  listing_mapping: erp_listing
tool:
  name: get_fba_stock_list
  arguments:
    fulfillment_channel_type: FBA
  dynamic_arguments:
    shop_argument: sid
    shop_batch_mode: single
    source_field: sid
    batch_size: 1
    database_param: sid_values
database:
  table: chatbi.fba_list
  sql: "select\n  sid,\n  msku,\n  fnsku,\n  sum(total_fulfillable_quantity) as total_fulfillable_quantity,\n\
    \  sum(afn_fulfillable_quantity) as afn_fulfillable_quantity,\n  sum(afn_reserved_quantity)\
    \ as afn_reserved_quantity,\n  sum(reserved_fc_transfers) as reserved_fc_transfers,\n\
    \  sum(reserved_fc_processing) as reserved_fc_processing,\n  sum(reserved_customerorders)\
    \ as reserved_customerorders,\n  sum(afn_unsellable_quantity) as afn_unsellable_quantity,\n\
    \  sum(afn_researching_quantity) as afn_researching_quantity,\n  sum(afn_inbound_working_quantity)\
    \ as afn_inbound_working_quantity,\n  sum(afn_inbound_shipped_quantity) as afn_inbound_shipped_quantity,\n\
    \  sum(afn_erp_real_shipped_quantity) as afn_erp_real_shipped_quantity,\n  sum(afn_inbound_receiving_quantity)\
    \ as afn_inbound_receiving_quantity\nfrom chatbi.fba_list\nwhere sid in :sid_values\n\
    group by\n  sid,\n  msku,\n  fnsku\n"
  params: {}
compare:
  dimensions:
  - sid
  - msku
  - fnsku
  metrics:
  - total_fulfillable_quantity
  - afn_fulfillable_quantity
  - afn_reserved_quantity
  - reserved_fc_transfers
  - reserved_fc_processing
  - reserved_customerorders
  - afn_unsellable_quantity
  - afn_researching_quantity
  - afn_inbound_working_quantity
  - afn_inbound_shipped_quantity
  - afn_erp_real_shipped_quantity
  - afn_inbound_receiving_quantity
  dimension_mappings:
    sid: sid
    seller_sku: msku
    fnsku: fnsku
  metric_mappings:
    total_fulfillable_quantity: total_fulfillable_quantity
    afn_fulfillable_quantity: afn_fulfillable_quantity
    afn_reserved_quantity: afn_reserved_quantity
    reserved_fc_transfers: reserved_fc_transfers
    reserved_fc_processing: reserved_fc_processing
    reserved_customerorders: reserved_customerorders
    afn_unsellable_quantity: afn_unsellable_quantity
    afn_researching_quantity: afn_researching_quantity
    afn_inbound_working_quantity: afn_inbound_working_quantity
    afn_inbound_shipped_quantity: afn_inbound_shipped_quantity
    real_transit_quantity: afn_erp_real_shipped_quantity
    afn_inbound_receiving_quantity: afn_inbound_receiving_quantity
  tolerance: 0.01
notes:
  raw_dimensions:
  - sid
  - + msku（领星中是seller_sku ）
  - + fnsku
  tool_output_fields:
  - total_fulfillable_quantity
  - afn_fulfillable_quantity
  - afn_reserved_quantity
  - reserved_fc_transfers
  - reserved_fc_processing
  - reserved_customerorders
  - afn_unsellable_quantity
  - afn_researching_quantity
  - afn_inbound_working_quantity
  - afn_inbound_shipped_quantity
  - real_transit_quantity
  - afn_inbound_receiving_quantity
  non_numeric_fields: []
  source: Generated from data/feishu/lingxing_mcp_tools.xlsx; review SQL and field
    paths before enabling.
