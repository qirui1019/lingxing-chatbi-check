lingxing_mcp:
  url: "https://openmcp.lingxing.com/mcp-servers/lingxing-mcp"
  timeout_seconds: 120
  users:
    default:
      x_mcp_key: "replace-with-mcp-key"

doris_mysql:
  host: "replace-with-doris-host"
  port: 9030
  user: "replace-with-doris-user"
  password: "replace-with-doris-password"
  database: "replace-with-doris-database"
  charset: "utf8mb4"

feishu:
  app_id: "replace-with-feishu-app-id"
  app_secret: "replace-with-feishu-app-secret"
  spreadsheet_token: "replace-with-target-spreadsheet-token"
  sheet_id: "replace-with-target-sheet-id"
  file_folder_token: "replace-with-upload-folder-token"
  result_header: "查询结果"
  read_range: "A1:Z1000"
