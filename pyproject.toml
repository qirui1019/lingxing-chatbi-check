[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lingxing-chatbi-check"
version = "0.1.0"
description = "自动校验领星 MCP tool 出参与 Doris/MySQL ChatBI 表数据"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "PyMySQL>=1.1.0",
    "pytest>=8.0.0",
    "PyYAML>=6.0.0",
    "SQLAlchemy>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
